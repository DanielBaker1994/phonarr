<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the page run under the notch and home indicator; app.css pads with the safe-area insets.
       Pinch zoom stays on (accessibility); inputs are 16 px so Safari never auto-zooms into a field. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Phonarr</title>
  <meta name="description" content="Discover films and TV and add them to Radarr and Sonarr in one tap." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <!-- Years and runtimes are not phone numbers -->
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <!-- Home screen web app on iPhone (Safari → Share → Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phonarr" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
  <!-- Posters come from these hosts (Radarr/Sonarr remote image URLs): open the connections early. -->
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="preconnect" href="https://artworks.thetvdb.com" />
  <link rel="stylesheet" href="css/app.css" />
  <!-- Every module and both config files load in parallel instead of one import level at a time.
       web/tests/shell.test.mjs fails if a module is missing here. -->
  <link rel="preload" href="config/settings.json" as="fetch" crossorigin />
  <link rel="preload" href="config/strings.json" as="fetch" crossorigin />
  <link rel="modulepreload" href="vendor/preact-htm.js" />
  <link rel="modulepreload" href="js/api.js" />
  <link rel="modulepreload" href="js/calendar.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/debug.js" />
  <link rel="modulepreload" href="js/filters.js" />
  <link rel="modulepreload" href="js/icons.js" />
  <link rel="modulepreload" href="js/log.js" />
  <link rel="modulepreload" href="js/models.js" />
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/views/activity.js" />
  <link rel="modulepreload" href="js/views/browse.js" />
  <link rel="modulepreload" href="js/views/calendar.js" />
  <link rel="modulepreload" href="js/views/compat.js" />
  <link rel="modulepreload" href="js/views/components.js" />
  <link rel="modulepreload" href="js/views/detail.js" />
  <link rel="modulepreload" href="js/views/filters.js" />
  <link rel="modulepreload" href="js/views/settings.js" />
  <link rel="modulepreload" href="js/views/similar.js" />
  <link rel="modulepreload" href="js/views/status.js" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Phonarr needs JavaScript.</noscript>
</body>
</html>
