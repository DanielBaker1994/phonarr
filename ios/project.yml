# XcodeGen spec. From the repo root run ./build-ios.sh (needs: brew install xcodegen), which generates and opens the project.
name: Phonarr
options:
  bundleIdPrefix: com.example.phonarr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # set your team in Xcode
targets:
  Phonarr:
    type: application
    platform: iOS
    sources:
      - Phonarr
    # Written by ./build-ios.sh before xcodegen runs: build number (git commit count) and commit,
    # so each TestFlight upload gets a new build and the debug report says exactly which build it is.
    configFiles:
      Debug: Version.xcconfig
      Release: Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonarr.app
        MARKETING_VERSION: "1.0"            # the version people see; bump by hand for a release
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Phonarr/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
